<article class="admin-card admin-card--wide">
  <h2 class="admin-card__title">{{ title }}</h2>
  <form class="admin-form admin-form--blog" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <app-input label="Título" type="text" customLabelStyle="app-input__label--light" formControlName="title"></app-input>
    </div>
    <div>
      <app-input label="Categoría" type="text" customLabelStyle="app-input__label--light" formControlName="category"></app-input>
    </div>
    <div class="admin-form__full">
      <app-input label="Imagen" type="text" customLabelStyle="app-input__label--light" formControlName="coverImage"></app-input>
    </div>
    <div class="admin-form__full">
      <label class="admin-form__label" for="blog-status">Estado</label>
      <select class="admin-form__control" id="blog-status" formControlName="status">
        <option value="draft">Borrador</option>
        <option value="in-review">En revisión</option>
        <option value="scheduled">Programado</option>
        <option value="published">Publicado</option>
      </select>
    </div>
    <div class="admin-form__full">
      <label class="admin-form__label" for="blog-excerpt">Extracto</label>
      <textarea class="admin-form__control admin-form__control--textarea" id="blog-excerpt" rows="3" formControlName="excerpt"></textarea>
    </div>
    <div class="admin-form__full">
      <label class="admin-form__label" for="blog-content">Contenido</label>
      <textarea class="admin-form__control admin-form__control--textarea" id="blog-content" rows="6" formControlName="content"></textarea>
    </div>
    <div class="admin-form__actions admin-form__full">
      <button app-button type="submit" class="app-btn app-btn--navy-solid">{{ submitLabel }}</button>
      @if (post) {
        <button app-button type="button" class="app-btn app-btn--line-navy" (click)="handleCancel()">Cancelar</button>
      }
    </div>
  </form>
</article>
