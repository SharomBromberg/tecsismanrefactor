<article class="admin-card admin-card--wide">
  <h2 class="admin-card__title">{{ title }}</h2>
  <form class="admin-form admin-form--blog" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label class="admin-form__label" for="blog-title">Título</label>
      <input class="admin-form__control" id="blog-title" type="text" formControlName="title" />
    </div>
    <div>
      <label class="admin-form__label" for="blog-category">Categoría</label>
      <input class="admin-form__control" id="blog-category" type="text" formControlName="category" />
    </div>
    <div class="admin-form__full">
      <label class="admin-form__label" for="blog-cover">Imagen</label>
      <input class="admin-form__control" id="blog-cover" type="text" formControlName="coverImage" />
    </div>
    <div class="admin-form__full">
      <label class="admin-form__label" for="blog-excerpt">Extracto</label>
      <textarea class="admin-form__control admin-form__control--textarea" id="blog-excerpt" rows="3" formControlName="excerpt"></textarea>
    </div>
    <div class="admin-form__full">
      <label class="admin-form__label" for="blog-content">Contenido</label>
      <textarea class="admin-form__control admin-form__control--textarea" id="blog-content" rows="6" formControlName="content"></textarea>
    </div>
    @if (feedback) {
      <p class="admin-form__feedback">{{ feedback }}</p>
    }
    <div class="admin-form__actions admin-form__full">
      <button class="admin-form__submit" type="submit">{{ submitLabel }}</button>
      @if (post) {
        <button class="admin-form__secondary" type="button" (click)="handleCancel()">Cancelar</button>
      }
    </div>
  </form>
</article>
