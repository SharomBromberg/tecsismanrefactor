<article class="admin-card">
  <h2 class="admin-card__title">{{ title }}</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" class="admin-form">
    <app-input
      label="Nombre de la categoría"
      type="text"
      customLabelStyle="app-input__label--light"
      placeholder="Ej. Redes empresariales"
      formControlName="name"
      [hasError]="hasError('required') || hasError('minlength')"
    ></app-input>
    @if (hasError('required')) {
      <small class="admin-form__error">El nombre es obligatorio.</small>
    }
    @if (hasError('minlength')) {
      <small class="admin-form__error">Mínimo 2 caracteres.</small>
    }

    <label class="admin-form__label" for="category-parent">Categoria padre</label>
    <select class="admin-form__control" id="category-parent" formControlName="parentId">
      <option value="">Sin categoria padre</option>
      @for (category of parentCategoryOptions; track trackByCategoryId($index, category)) {
        <option [value]="category._id">{{ category.name }}</option>
      }
    </select>

    <div class="admin-form__actions">
      <button
        app-button
        type="submit"
        class="app-btn app-btn--navy-solid"
        [disabled]="form.invalid"
      >
        {{ submitLabel }}
      </button>
      @if (editingCategoryId) {
        <button
          app-button
          type="button"
          class="app-btn app-btn--line-navy"
          (click)="cancelEdit()"
        >
          Cancelar
        </button>
      }
    </div>
  </form>

  <ul class="admin-list">
    @for (category of categories; track trackByCategoryId($index, category)) {
      <li class="admin-list__item">
        <div class="admin-list__content">
          <strong>{{ category.name }}</strong>
          <small>{{ resolveParentName(category) }}</small>
        </div>
        <div class="admin-list__actions">
          <button
            app-button
            type="button"
            class="app-btn app-btn--line-navy admin-list__action"
            (click)="edit(category)"
          >
            <app-icon name="edit" size="sm"></app-icon>
            <span>Editar</span>
          </button>
          <button
            app-button
            type="button"
            class="app-btn app-btn--danger admin-list__action"
            (click)="remove(category)"
          >
            <app-icon name="trash" size="sm"></app-icon>
            <span>Eliminar</span>
          </button>
        </div>
      </li>
    }
  </ul>
</article>
