<article class="admin-card admin-card--profile">
  <div class="admin-card__heading">
    <div>
      <p class="admin-card__eyebrow">Perfil del administrador</p>
      <h2 class="admin-card__title">Tu cuenta y seguridad</h2>
    </div>
    <span class="admin-card__role">{{ role }}</span>
  </div>

  <div class="admin-profile-meta">
    <div>
      <span class="admin-profile-meta__label">Usuario</span>
      <strong class="admin-profile-meta__value">{{ username }}</strong>
    </div>
    <div>
      <span class="admin-profile-meta__label">Permisos</span>
      <strong class="admin-profile-meta__value">Gestion editorial y catalogo</strong>
    </div>
  </div>

  <form class="admin-form" [formGroup]="profileForm" (ngSubmit)="submitProfile()">
    <app-input label="Nombre visible" type="text" customLabelStyle="app-input__label--light" formControlName="displayName"></app-input>
    <button app-button type="submit" class="app-btn app-btn--navy-solid">Guardar cambios</button>
  </form>

  <form class="admin-form" [formGroup]="passwordForm" (ngSubmit)="submitPassword()">
    <app-input label="Contraseña actual" type="password" customLabelStyle="app-input__label--light" formControlName="currentPassword"></app-input>
    <app-input label="Nueva contraseña" type="password" customLabelStyle="app-input__label--light" formControlName="nextPassword"></app-input>
    <button app-button type="submit" class="app-btn app-btn--line-navy">Actualizar contraseña</button>
  </form>
</article>
