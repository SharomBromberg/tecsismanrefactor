<article class="product-card" [class.product-card--grid]="variant === 'grid'">
  <div class="product-card__media">
    @if (product.images.length > 0) {
      <img
        class="product-card__image"
        [src]="product.images[0]"
        [alt]="product.name"
        loading="lazy"
      />
    } @else {
      <div class="product-card__placeholder" aria-hidden="true"></div>
    }

    <span class="product-card__badge">{{ categoryName }}</span>

    @if (showFavorite) {
      <button
        type="button"
        class="product-card__favorite"
        [class.product-card__favorite--active]="isFavorite"
        (click)="onFavoriteToggle($event)"
        [attr.aria-label]="isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      >
        <app-icon [name]="isFavorite ? 'heart-filled' : 'heart'" size="sm"></app-icon>
      </button>
    }
  </div>

  <div class="product-card__body">
    <div class="product-card__copy">
      <h3 class="product-card__title">{{ product.name }}</h3>
      <p class="product-card__description">{{ product.description }}</p>
    </div>

    <div class="product-card__footer">
      <div class="product-card__price-block">
        <span class="product-card__price-label">Desde</span>
        <strong class="product-card__price">{{ product.price | currency:'COP':'symbol':'1.0-0' }}</strong>
      </div>

      <div class="product-card__actions">
        <a
          app-button
          class="app-btn app-btn--white-outline product-card__action"
          [routerLink]="['/Productos', product._id]"
        >
          Ver detalle
        </a>
        <button
          app-button
          type="button"
          class="app-btn app-btn--gradient product-card__action product-card__action--primary"
          (click)="onAddToCart()"
        >
          Agregar al carrito
        </button>
      </div>
    </div>
  </div>
</article>
