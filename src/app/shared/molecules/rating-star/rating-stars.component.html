<div class="rating-stars" [class.rating-stars--readonly]="readOnly()">
  @for (star of [1, 2, 3, 4, 5]; track star) {
  <button type="button" class="rating-stars__button" [class.active]="star <= rating()" [disabled]="readOnly()"
    [attr.aria-label]="'Calificar con ' + star + ' estrella' + (star > 1 ? 's' : '')" (click)="selectRating(star)">
    <app-icon [name]="star <= rating() ? 'star-filled' : 'star-empty'" [size]="size()"></app-icon>
  </button>
  }
</div>
