<div class="app-input__wrapper">
  @if (label) {
    <label class="app-input__label" [ngClass]="customLabelStyle" [for]="inputId">{{ label }}</label>
  }

  <input
    [id]="inputId"
    class="app-input"
    [ngClass]="customStyle"
    [type]="type"
    [(ngModel)]="inputValue"
    (input)="getTextInput($event)"
    [placeholder]="placeholder"
    [disabled]="isDisabled"
  />
</div>
