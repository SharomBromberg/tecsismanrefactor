<section class="booking" aria-labelledby="booking-title">
  <div class="app-container booking__container">
    <h2 id="booking-title" class="booking__title">Agenda tu Cita</h2>

    <div class="booking__grid" role="list">
      @for (service of appointmentServices(); track service.id) {
        <div class="booking__item" role="listitem">
          <app-card
            [data]="service"
            (actionClick)="handleBookingClick(service.id)">
          </app-card>
        </div>
      }
    </div>
  </div>
</section>
