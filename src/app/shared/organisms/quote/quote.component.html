<section class="quote" aria-label="Testimonio de un cliente">
  <div class="app-container quote__container">
    <div class="quote__avatar">
      <img [src]="avatarUrl" [alt]="author" loading="lazy" />
    </div>

    <div class="quote__copy">
      <p class="quote__text">&ldquo;{{ quote }}&rdquo;</p>
      <p class="quote__meta">{{ author }} · {{ role }}</p>
    </div>
  </div>
</section>
