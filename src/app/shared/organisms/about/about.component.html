<section class="about" aria-labelledby="about-title">
  <div class="app-container about__container">
    <h2 id="about-title" class="about__title">Sobre Nosotros</h2>

    <div class="about__grid" role="list">
      @for (item of aboutItems; track item.id) {
        <div class="about__item" role="listitem">
          <app-card [data]="item"></app-card>
        </div>
      }
    </div>
  </div>
</section>
