<header class="page-header" [attr.aria-label]="ariaLabel">
    <div class="app-container page-header__inner">
        <span class="page-header__eyebrow">{{ eyebrow }}</span>
        <h1 class="page-header__title">{{ title }}</h1>
        @if (subtitle) { <p class="page-header__subtitle">{{ subtitle }}</p> }
    </div>
</header>
