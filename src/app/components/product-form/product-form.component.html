<div class="product-form-container">
  <div class="form-card">
    <h1>Crear Producto</h1>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nombre:</label>
        <input id="name" type="text" formControlName="name" />
      </div>
      <div class="form-group">
        <label for="description">Descripción:</label>
        <input id="description" type="text" formControlName="description" />
      </div>
      <div class="form-group">
        <label for="price">Precio:</label>
        <input id="price" type="number" step="0.01" min="0" formControlName="price" />
      </div>
      <div class="form-group">
        <label for="category">Categoría:</label>
        <select id="category" formControlName="category">
          @for (category of categories; track category) {
            <option [value]="category._id">{{ category.name }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="files">Subir Imágenes:</label>
        <input id="files" type="file" multiple accept="image/*" (change)="addSelectedImages($event)" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-submit">Crear Producto</button>
        <button type="button" class="btn-cancel" (click)="resetForm()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
