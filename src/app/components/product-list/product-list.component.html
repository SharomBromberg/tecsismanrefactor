<div>
  <label for="categoryFilter">Filtrar por categoría</label>
  <select id="categoryFilter" [(ngModel)]="selectedCategoryId" (change)="filterProductsByCategory()" aria-label="Filtro de categoría">
    <option value="" selected>Todas las Categorías</option>
    @for (category of categories; track category) {
      <option [value]="category._id">{{ category.name }}</option>
    }
  </select>
  @if (noProductsMessage) {
    <div class="message-container" aria-live="polite">
      <p class="muted">{{ noProductsMessage }}</p>
    </div>
  }

  <div class="product-list app-container">
    @for (product of products; track product) {
      <div class="card card-body mb-2">
        <div class="row">
          <div class="col-md-8">
            <ul>
              <!-- <li> id: {{product._id}} </li> -->
              <li> name: {{product.name}} </li>
              <li> description: {{product.description}} </li>
              <li> price: {{product.price}} </li>
              <!-- <li> category: {{product.category}} </li>
              <li> createdAt: {{product.createdAt}} </li> -->
            </ul>
            <!-- <button (click)="deleteProduct(product?._id)" class="btn btn-danger"> Delete </button> -->
            <!-- <button [routerLink]="['/product/update', product._id]" class="btn btn-secondary"> Edit </button> -->
          </div>
          <div class="col-md-4">
            <!-- <img [src]="product.imagesURL" class="card-img"> -->
            @for (filename of product.filenames; track filename) {
              <div class="picture">
                <img [src]="'http://localhost:3000/products/uploads/' + filename" alt="Imagen de producto" loading="lazy" decoding="async">
              </div>
            }
          </div>
        </div>
      </div>
    }
